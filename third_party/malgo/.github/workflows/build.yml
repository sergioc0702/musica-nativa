on: [push, pull_request]
name: Build
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.21.x, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Build
      run: go build
    - name: Vet
      run: go vet
    - name: Test
      if: matrix.os != 'macos-latest' || matrix.go-version != '1.21.x'
      run: go test -v -run "TestContextLifecycle|TestDeviceID|TestParseDeviceID|TestDataConverter"
  cross:
    strategy:
      matrix:
        arch: [arm64, riscv64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.arch == 'arm64' && 'aarch64' || 'riscv64' }}-linux-gnu
    - name: Build
      run: go build
      env:
        CGO_ENABLED: 1
        GOARCH: ${{ matrix.arch }}
        CC: ${{ matrix.arch == 'arm64' && 'aarch64' || 'riscv64' }}-linux-gnu-gcc
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Format
      run: |
        if [ -n "$(gofmt -l $(git ls-files '*.go'))" ]; then
          gofmt -d $(git ls-files '*.go')
          exit 1
        fi
